<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devil — Stoke the Inferno</title>
<style>
  :root{
    --bg:#100606;
    --panel:#1d0d0d;
    --panel2:#281111;
    --line:#603030;
    --text:#f8ece4;
    --muted:#b99b91;
    --orange:#ff8a3d;
    --gold:#ffd36a;
    --red:#e74b45;
    --green:#75d37a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% 15%,#3a1212 0,#1b0909 38%,#0d0404 78%);
  }
  button,input{font:inherit}
  button{
    border:0;
    border-radius:12px;
    min-height:42px;
    padding:10px 15px;
    font-weight:800;
    cursor:pointer;
    color:#1a0804;
    background:linear-gradient(#ffc166,#ff7d36);
  }
  button.secondary{color:var(--text);background:#432020;border:1px solid #693232}
  button.danger{color:white;background:linear-gradient(#c84642,#8f2423)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .app{max-width:1120px;margin:auto;padding:14px 16px 26px}
  .heading{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:10px}
  .heading h1{margin:0;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:.08em;line-height:1}
  .heading p{margin:3px 0 0;color:var(--muted);font-size:.9rem;text-align:left}
  .topbar{
    display:flex;align-items:center;justify-content:center;gap:20px;
    padding:7px 12px;margin-bottom:10px;border:1px solid var(--line);
    border-radius:12px;background:rgba(24,9,9,.72)
  }
  .miniStat{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
  .miniStat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .miniStat strong{font-size:1rem;color:var(--text)}
  .setup{
    border:1px solid var(--line);border-radius:14px;background:rgba(29,13,13,.86);
    padding:12px;margin-bottom:12px
  }
  .setup.hiddenSetup{display:none}
  .setupHeader{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
  .setupHeader h2{margin:1px 0 0;font-size:1.35rem}
  .setupEyebrow{font-size:.64rem;letter-spacing:.16em;color:var(--orange);font-weight:900}
  .setupClose{min-height:36px;padding:7px 10px;font-size:.76rem}
  .setupToggle{min-height:36px;padding:7px 11px;font-size:.78rem;color:var(--text);background:#432020;border:1px solid #693232;white-space:nowrap}

  .setupRow{
    display:grid;grid-template-columns:130px 130px minmax(260px,1fr) auto;
    gap:10px;align-items:end
  }
  label{display:block;color:var(--muted);font-size:.75rem;margin-bottom:4px}
  input{
    width:100%;min-height:42px;border:1px solid #5d2c2c;border-radius:10px;
    background:#120707;color:var(--text);padding:9px 10px;outline:none
  }
  input:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,138,61,.18)}
  .nameGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .nameGrid input{min-height:36px;padding:7px 9px;font-size:.88rem}
  .playerNameField{min-width:0}
  .playerNameField label{font-size:.67rem;margin-bottom:3px;color:#cbaea2}
  .playerNameInput{display:block}
  .scene{
    position:relative;
    width:min(100%,780px);
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:50%;
    border:1px solid rgba(136,60,60,.48);
    background:
      radial-gradient(circle at center,rgba(255,92,25,.09) 0 21%,transparent 22%),
      radial-gradient(circle at center,rgba(255,255,255,.025),rgba(0,0,0,.13) 62%,rgba(0,0,0,.26));
    overflow:hidden;
  }
  .scene:before,.scene:after{
    content:"";position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(255,176,90,.13);pointer-events:none
  }
  .scene:after{inset:25%;border-style:solid;border-color:rgba(255,120,60,.10)}
  .center{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:34%;min-width:210px;aspect-ratio:1/1;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:radial-gradient(circle,#3a1410 0,#1a0908 65%,#0e0505 100%);
    border:1px solid #71362c;z-index:2;
    transition:box-shadow .35s ease,border-color .35s ease
  }
  .flameCluster{
    position:relative;
    width:118px;
    height:82px;
    margin-bottom:2px;
    pointer-events:none;
  }
  .flameIcon{
    position:absolute;
    left:50%;
    top:50%;
    line-height:1;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:50% 100%;
    filter:drop-shadow(0 0 12px rgba(255,117,36,.38));
    transition:
      left .35s ease,
      top .35s ease,
      transform .35s cubic-bezier(.2,.8,.2,1),
      filter .35s ease,
      opacity .25s ease;
    user-select:none;
  }
  .infernoLabel{font-size:.64rem;letter-spacing:.13em;color:var(--muted);text-transform:uppercase;margin-top:2px}
  .infernoNum{font-size:clamp(2rem,5vw,3.4rem);font-weight:950;color:var(--gold);line-height:1}
  .die{
    margin-top:6px;width:66px;height:66px;border-radius:15px;display:grid;place-items:center;
    border:1px solid #8b5043;background:#160908;font-size:2rem;font-weight:950;
    box-shadow:inset 0 0 18px rgba(255,255,255,.035)
  }
  .die.rolling{transform:rotate(-4deg) scale(1.05)}
  .die.finalResult{
    transform:scale(1.38);
    border-color:#c98652;
    box-shadow:
      0 0 0 3px rgba(255,173,95,.13),
      0 0 28px rgba(255,123,57,.32),
      inset 0 0 18px rgba(255,255,255,.045);
    transition:transform .22s cubic-bezier(.2,.9,.2,1),border-color .22s ease,box-shadow .22s ease;
  }
  .diceRow{display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px}
  .die.hiddenDie{display:none}
  .die.burned{
    opacity:.14;transform:scale(.58) rotate(15deg);filter:blur(1px);
    border-color:#5e241f;box-shadow:none;transition:all .55s ease
  }
  .die.kept{
    transform:scale(1.48);border-color:#ffd36a;
    box-shadow:0 0 0 4px rgba(255,211,106,.12),0 0 34px rgba(255,113,36,.48),inset 0 0 18px rgba(255,255,255,.05);
    transition:all .26s cubic-bezier(.16,.9,.2,1)
  }
  .stokeBtn{color:#fff;background:linear-gradient(#d64a32,#8e1d17);border:1px solid #e36a42}
  .token.stoke{border-color:#b9492d;color:#ffb07c}
  .center.stoking{animation:stokeCore .9s cubic-bezier(.16,.84,.25,1)}
  .center.stoking .flameIcon{animation:stokeFlame .9s cubic-bezier(.16,.84,.25,1)}
  .center.stoking .infernoNum{animation:stokeNumber .9s cubic-bezier(.16,.84,.25,1)}
  @keyframes stokeCore{
    0%{box-shadow:0 0 8px rgba(255,80,25,.12)}
    35%{transform:translate(-50%,-50%) scale(1.055);box-shadow:0 0 78px rgba(255,70,20,.72)}
    100%{transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes stokeFlame{0%{filter:drop-shadow(0 0 10px rgba(255,117,36,.3))}45%{filter:drop-shadow(0 0 35px rgba(255,140,40,.9));transform:translate(-50%,-50%) scale(1.35)}100%{}}
  @keyframes stokeNumber{35%{transform:scale(1.42);text-shadow:0 0 24px rgba(255,190,70,.8)}100%{transform:scale(1)}}
  @media(max-width:560px){
    .center.stoking{animation:stokeCoreMobile .9s cubic-bezier(.16,.84,.25,1)}
    @keyframes stokeCoreMobile{0%{transform:scale(1)}35%{transform:scale(1.035);box-shadow:0 0 58px rgba(255,70,20,.65)}100%{transform:scale(1)}}
  }
  .turnText{margin-top:6px;max-width:190px;font-size:.78rem;line-height:1.25;color:#f2ddd3}
  .seat{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:132px;min-height:72px;padding:8px 9px;border:1px solid #5b2b2b;border-radius:13px;
    background:linear-gradient(rgba(255,255,255,.035),rgba(0,0,0,.09)),#211010;
    text-align:center;z-index:3;transition:transform .18s ease,border-color .18s ease,opacity .18s ease,box-shadow .18s ease
  }
  .seat.active{border-color:var(--orange);transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 0 2px rgba(255,126,50,.13)}
  .seat.out{opacity:.38;filter:grayscale(.55)}
  .seat.protected{border-color:#9c7b39}
  .seatName{font-weight:900;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seatRoll{font-size:1.25rem;font-weight:950;line-height:1.05;margin:3px 0}
  .seatStatus{font-size:.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
  .seatRolls{font-size:.58rem;color:#9f8178;margin-top:3px}
  .seat .tokens{display:flex;justify-content:center;gap:4px;margin-top:5px}
  .token{font-size:.58rem;border-radius:999px;padding:2px 5px;border:1px solid #593030;color:#d8bab0}
  .token.ready{border-color:#886c31;color:#f5d77d}
  .token.skip{border-color:#997d3b;color:#ffe596}
  .controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:10px}
  .decision{display:none}
  .message{
    margin:10px auto 0;max-width:780px;text-align:center;min-height:22px;
    color:#eed8cc;font-size:.9rem
  }
  .winner{
    display:none;margin:12px auto 0;max-width:780px;padding:12px;border:1px solid #9a7935;
    border-radius:12px;text-align:center;background:rgba(117,72,16,.16);font-size:1.12rem;font-weight:900;color:#ffe7a3
  }
  details{
    max-width:780px;margin:10px auto 0;border:1px solid #512626;border-radius:12px;
    background:rgba(23,9,9,.72);overflow:hidden
  }
  summary{cursor:pointer;padding:9px 11px;color:var(--muted);font-size:.78rem}
  .log{max-height:170px;overflow:auto;padding:0 11px 9px}
  .log div{padding:6px 0;border-top:1px solid rgba(255,255,255,.05);font-size:.78rem;color:#dfc5ba}
  @media(max-width:820px){
    .setupRow{grid-template-columns:1fr 1fr}
    .namesWrap{grid-column:1/-1}
    .startWrap{grid-column:1/-1}
    .startWrap button{width:100%}
    .seat{width:110px;min-height:65px;padding:6px}
    .seatName{font-size:.78rem}.seatRoll{font-size:1.05rem}.seatStatus{font-size:.56rem}
    .center{min-width:180px}
  }
  @media(max-width:560px){
    body.setup-open{overflow:hidden}
    .heading{display:flex;align-items:center}.heading p{text-align:left;margin-top:5px}
    .heading h1{font-size:2rem}
    .setupToggle{font-size:.7rem;padding:7px 9px}
    .setup{
      position:fixed;inset:0;z-index:1000;margin:0;border:0;border-radius:0;
      padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      overflow:auto;background:
        radial-gradient(circle at 50% 8%,#431515 0,#1c0909 36%,#0d0404 82%);
    }
    .setupHeader{position:sticky;top:0;z-index:2;padding:4px 0 10px;background:linear-gradient(#1a0808 75%,transparent)}
    .setupHeader h2{font-size:1.65rem}
    .setupRow{grid-template-columns:1fr 1fr;align-items:stretch}
    .setupRow>div:first-child,.setupRow>div:nth-child(2){align-self:end}
    .namesWrap,.startWrap{grid-column:1/-1}
    .nameGrid{grid-template-columns:1fr;gap:9px}
    .nameGrid input{min-height:48px;font-size:1rem}
    #playerCount,#ante{min-height:48px;font-size:1.05rem}
    .startWrap button{width:100%;min-height:54px;font-size:1.05rem;margin-top:4px}

    .topbar{gap:10px;justify-content:space-between;padding:6px 8px;overflow:hidden}
    .miniStat{display:block;text-align:center}.miniStat span{display:block;font-size:.55rem}.miniStat strong{font-size:.9rem}
    .nameGrid{grid-template-columns:1fr}
    .playerNameField label{font-size:.78rem;margin-bottom:5px}
    .scene{
      aspect-ratio:auto;border-radius:16px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px;overflow:visible
    }
    .scene:before,.scene:after{display:none}
    .center{
      position:relative;left:auto;top:auto;transform:none;grid-column:1/-1;width:auto;min-width:0;aspect-ratio:auto;border-radius:14px;padding:14px
    }
    .seat{position:relative;left:auto!important;top:auto!important;transform:none!important;width:auto;min-height:64px}
    .seat.active{transform:none}
  }
</style>
</head>
<body>
<div class="app">
  <div class="heading">
    <div>
      <h1>DEVIL</h1>
      <p>Last one standing takes the pot.</p>
    </div>
    <button id="setupToggleBtn" class="setupToggle" type="button">Players / New Game</button>
  </div>

  <div class="topbar" aria-label="Game status">
    <div class="miniStat"><span>Pot</span><strong id="pot">0</strong></div>
    <div class="miniStat"><span>Inferno</span><strong id="infernoTop">3</strong></div>
    <div class="miniStat"><span>Round</span><strong id="round">1</strong></div>
    <div class="miniStat"><span>Alive</span><strong id="alive">0</strong></div>
  </div>

  <section id="setupPanel" class="setup">
    <div class="setupHeader">
      <div>
        <div class="setupEyebrow">GAME SETUP</div>
        <h2>Set Players</h2>
      </div>
      <button id="setupCloseBtn" class="secondary setupClose" type="button">Back to Game</button>
    </div>
    <div class="setupRow">
      <div>
        <label for="playerCount">Players</label>
        <input id="playerCount" type="number" min="2" max="12" value="4">
      </div>
      <div>
        <label for="ante">Ante</label>
        <input id="ante" type="number" min="1" value="1">
      </div>
      <div class="namesWrap">
        <label>Player names</label>
        <div id="nameGrid" class="nameGrid">
          <div class="playerNameField"><label for="playerName1">Player 1</label><input id="playerName1" class="playerNameInput" type="text" maxlength="22" value="Player 1" aria-label="Player 1 name"></div>
          <div class="playerNameField"><label for="playerName2">Player 2</label><input id="playerName2" class="playerNameInput" type="text" maxlength="22" value="Player 2" aria-label="Player 2 name"></div>
          <div class="playerNameField"><label for="playerName3">Player 3</label><input id="playerName3" class="playerNameInput" type="text" maxlength="22" value="Player 3" aria-label="Player 3 name"></div>
          <div class="playerNameField"><label for="playerName4">Player 4</label><input id="playerName4" class="playerNameInput" type="text" maxlength="22" value="Player 4" aria-label="Player 4 name"></div>
        </div>
      </div>
      <div class="startWrap">
        <button id="startBtn" type="button">Start Game</button>
      </div>
    </div>
  </section>

  <div id="scene" class="scene">
    <div id="infernoCore" class="center">
      <div id="flameCluster" class="flameCluster" aria-hidden="true"></div>
      <div class="infernoLabel">Inferno</div>
      <div id="infernoCenter" class="infernoNum">3</div>
      <div class="diceRow" aria-label="Roll result">
        <div id="die" class="die">—</div>
        <div id="die2" class="die hiddenDie">—</div>
      </div>
      <div id="turnText" class="turnText">Set the players and begin.</div>
    </div>
  </div>

  <div class="controls">
    <button id="rollBtn" type="button" disabled>Roll d12</button>
    <button id="stokeBtn" class="stokeBtn" type="button" disabled>Stoke the Inferno</button>
    <div id="decision" class="decision">
      <button id="rerollBtn" type="button">Pay Ante & Reroll</button>
      <button id="declineBtn" class="secondary" type="button">Accept Elimination</button>
    </div>
  </div>

  <div id="message" class="message" aria-live="polite"></div>
  <div id="winner" class="winner"></div>

  <details>
    <summary>Game log</summary>
    <div id="log" class="log"></div>
  </details>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const els = {
    count:$("playerCount"), ante:$("ante"), nameGrid:$("nameGrid"), start:$("startBtn"),
    setup:$("setupPanel"), setupToggle:$("setupToggleBtn"), setupClose:$("setupCloseBtn"),
    pot:$("pot"), infernoTop:$("infernoTop"), round:$("round"), alive:$("alive"),
    scene:$("scene"), infernoCenter:$("infernoCenter"), flameCluster:$("flameCluster"), infernoCore:$("infernoCore"), die:$("die"), die2:$("die2"), turnText:$("turnText"),
    roll:$("rollBtn"), stoke:$("stokeBtn"), decision:$("decision"), reroll:$("rerollBtn"), decline:$("declineBtn"),
    message:$("message"), winner:$("winner"), log:$("log")
  };

  const state = {
    players:[], ante:1, pot:0, inferno:3, round:1, current:0,
    turnsLeft:0, roundHadElimination:false, gameOver:false,
    awaitingDecision:false, rolling:false
  };

  let rollTimer = null;

  function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
  function d12(){ return Math.floor(Math.random()*12)+1; }
  function alivePlayers(){ return state.players.filter(p=>p.alive); }
  function currentPlayer(){ return state.players[state.current]; }

  function openSetup(){
    els.setup.classList.remove("hiddenSetup");
    document.body.classList.add("setup-open");
    els.setupClose.style.display=state.players.length ? "" : "none";
    setTimeout(()=>els.count.focus({preventScroll:true}),40);
  }

  function closeSetup(){
    els.setup.classList.add("hiddenSetup");
    document.body.classList.remove("setup-open");
  }

  function syncNameInputs(){
    const count = clamp(parseInt(els.count.value||"4",10),2,12);
    const old = [...els.nameGrid.querySelectorAll("input")].map(i=>i.value);
    els.nameGrid.innerHTML = "";
    for(let i=0;i<count;i++){
      const wrap=document.createElement("div");
      wrap.className="playerNameField";
      const label=document.createElement("label");
      const id=`playerName${i+1}`;
      label.htmlFor=id;
      label.textContent=`Player ${i+1}`;
      const input=document.createElement("input");
      input.id=id;
      input.className="playerNameInput";
      input.type="text";
      input.maxLength=22;
      input.value=old[i] || `Player ${i+1}`;
      input.setAttribute("aria-label",`Player ${i+1} name`);
      wrap.append(label,input);
      els.nameGrid.appendChild(wrap);
    }
  }

  function log(text){
    const row=document.createElement("div");
    row.textContent=text;
    els.log.appendChild(row);
    els.log.scrollTop=els.log.scrollHeight;
  }

  function nextAliveIndex(from){
    for(let step=1;step<=state.players.length;step++){
      const i=(from+step)%state.players.length;
      if(state.players[i].alive) return i;
    }
    return -1;
  }

  function positionSeats(){
    const seats=[...els.scene.querySelectorAll(".seat")];
    const count=seats.length;
    if(!count) return;
    if(window.innerWidth<=560){
      seats.forEach(s=>{s.style.left="";s.style.top="";});
      return;
    }
    const radius = count <= 6 ? 39 : count <= 9 ? 41 : 43;
    const startAngle=-90;
    seats.forEach((seat,i)=>{
      const a=(startAngle + i*(360/count))*Math.PI/180;
      const x=50 + Math.cos(a)*radius;
      const y=50 + Math.sin(a)*radius;
      seat.style.left=x+"%";
      seat.style.top=y+"%";
    });
  }

  function renderSeats(){
    const cp=currentPlayer();
    const validIds=new Set(state.players.map(p=>String(p.id)));

    // Remove seats only when the player list itself changes.
    els.scene.querySelectorAll(".seat").forEach(seat=>{
      if(!validIds.has(seat.dataset.playerId)) seat.remove();
    });

    state.players.forEach((p,i)=>{
      let seat=els.scene.querySelector(`.seat[data-player-id="${p.id}"]`);

      // Seats are created once, then kept in the same DOM position for the game.
      if(!seat){
        seat=document.createElement("div");
        seat.className="seat";
        seat.dataset.playerId=String(p.id);
        seat.innerHTML=`
          <div class="seatName"></div>
          <div class="seatRoll">—</div>
          <div class="seatStatus"></div>
          <div class="seatRolls"></div>
          <div class="tokens"></div>`;
        els.scene.appendChild(seat);
      }

      seat.classList.toggle("out",!p.alive);
      seat.classList.toggle("active",!!(p.alive && cp && cp.id===p.id && !state.gameOver));
      seat.classList.toggle("protected",!!(p.skipNext && p.alive));

      const nameEl=seat.querySelector(".seatName");
      const rollEl=seat.querySelector(".seatRoll");
      const statusEl=seat.querySelector(".seatStatus");
      const rollsEl=seat.querySelector(".seatRolls");
      const tokensEl=seat.querySelector(".tokens");

      nameEl.textContent=p.name;
      nameEl.title=p.name;
      rollEl.textContent=p.lastRoll ?? "—";
      statusEl.textContent=p.alive ? p.status : "OUT";
      rollsEl.textContent=`${p.rollsMade} roll${p.rollsMade===1 ? "" : "s"} made`;

      tokensEl.innerHTML="";
      if(p.alive && !p.rerollUsed){
        const token=document.createElement("span");
        token.className="token ready";
        token.textContent="REROLL";
        tokensEl.appendChild(token);
      }
      if(p.alive && !p.stokeUsed){
        const token=document.createElement("span");
        token.className="token stoke";
        token.textContent="STOKE";
        tokensEl.appendChild(token);
      }
      if(p.alive && p.skipNext){
        const token=document.createElement("span");
        token.className="token skip";
        token.textContent="SKIP";
        tokensEl.appendChild(token);
      }
    });

    positionSeats();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  }

  function render(){
    els.pot.textContent=state.pot;
    els.infernoTop.textContent=state.inferno;
    els.infernoCenter.textContent=state.inferno;
    els.round.textContent=state.round;
    els.alive.textContent=alivePlayers().length;

    const heatSteps=Math.max(0,state.inferno-3);
    const flameCount=Math.min(9,1+heatSteps);
    while(els.flameCluster.children.length<flameCount){
      const flame=document.createElement("span");
      flame.className="flameIcon";
      flame.textContent="🔥";
      els.flameCluster.appendChild(flame);
    }
    while(els.flameCluster.children.length>flameCount){
      els.flameCluster.lastElementChild.remove();
    }

    const layouts = [
      [50,54,1.55],
      [29,58,1.05],[71,58,1.05],
      [50,27,1.10],
      [20,31,.82],[80,31,.82],
      [34,19,.74],[66,19,.74],
      [50,8,.68]
    ];
    [...els.flameCluster.children].forEach((flame,i)=>{
      const [x,y,s]=layouts[i];
      flame.style.left=x+"%";
      flame.style.top=y+"%";
      flame.style.fontSize=`${Math.min(4.6,2.4 + heatSteps*.12)}rem`;
      flame.style.transform=`translate(-50%,-50%) scale(${s})`;
      flame.style.filter=`drop-shadow(0 0 ${Math.min(30,12+heatSteps*2)}px rgba(255,117,36,.52))`;
    });

    els.infernoCore.style.boxShadow=`0 0 ${Math.min(58,heatSteps*7)}px rgba(255,80,25,${Math.min(.36,.07+heatSteps*.03)})`;
    els.infernoCore.style.borderColor=heatSteps>0 ? "#8a4030" : "#71362c";

    renderSeats();

    const p=currentPlayer();
    if(!state.players.length){
      els.roll.disabled=true;
      els.stoke.disabled=true;
      els.stoke.textContent="Stoke the Inferno";
      els.roll.textContent="Roll d12";
      els.turnText.textContent="Set the players and begin.";
      els.decision.style.display="none";
      return;
    }
    if(state.gameOver){
      els.roll.disabled=true;
      els.stoke.disabled=true;
      els.roll.textContent="Game Over";
      els.stoke.textContent="Stoke the Inferno";
      els.turnText.textContent="Game over.";
      els.decision.style.display="none";
      return;
    }
    if(state.awaitingDecision){
      els.roll.disabled=true;
      els.stoke.disabled=true;
      els.roll.textContent="Decision Needed";
      els.decision.style.display="flex";
      els.reroll.textContent=`Pay ${p.rollsMade} & Reroll`;
      els.turnText.textContent=`${p.name} is below the Inferno.`;
      return;
    }
    els.decision.style.display="none";
    els.roll.disabled=state.rolling;
    const canStoke=!state.rolling && !p.skipNext && !p.stokeUsed && state.inferno<12;
    els.stoke.disabled=!canStoke;
    if(p.stokeUsed) els.stoke.textContent="Stoke Used";
    else if(state.inferno>=12) els.stoke.textContent="Stoke Unavailable";
    else if(p.skipNext) els.stoke.textContent="Protected This Turn";
    else els.stoke.textContent="Stoke the Inferno";
    if(p.skipNext){
      els.roll.textContent=`Use ${p.name}'s Skip`;
      els.turnText.textContent=`${p.name} is protected by a 12.`;
    }else{
      els.roll.textContent=`Roll for ${p.name}`;
      els.turnText.textContent=`${p.name}'s turn.`;
    }
  }

  function startGame(){
    if(rollTimer){clearTimeout(rollTimer);rollTimer=null;}
    const count=clamp(parseInt(els.count.value||"4",10),2,12);
    const ante=Math.max(1,parseInt(els.ante.value||"1",10));
    els.count.value=count;
    els.ante.value=ante;
    const inputs=[...els.nameGrid.querySelectorAll("input")];
    const names=Array.from({length:count},(_,i)=>(inputs[i]?.value.trim() || `Player ${i+1}`));

    state.players=names.map((name,i)=>({
      id:i,name,alive:true,skipNext:false,rerollUsed:false,stokeUsed:false,lastRoll:null,rollsMade:0,status:"Ready"
    }));
    state.ante=ante;
    state.pot=count*ante;
    state.inferno=3;
    state.round=1;
    state.current=0;
    state.turnsLeft=count;
    state.roundHadElimination=false;
    state.gameOver=false;
    state.awaitingDecision=false;
    state.rolling=false;

    els.log.innerHTML="";
    els.die.textContent="—";
    els.die2.textContent="—";
    els.die.classList.remove("rolling","finalResult","burned","kept");
    els.die2.classList.add("hiddenDie");
    els.die2.classList.remove("rolling","finalResult","burned","kept");
    els.message.textContent=`Everyone antes ${ante}. ${names[0]} rolls first.`;
    els.winner.style.display="none";
    els.winner.textContent="";
    log(`Everyone antes ${ante}. Pot: ${state.pot}.`);
    log(`The Inferno begins at 3.`);
    log(`${names[0]} rolls first.`);
    closeSetup();
    render();
  }

  function animateRoll(finalValue,done){
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    els.die2.classList.add("hiddenDie");
    els.die2.classList.remove("rolling","finalResult","burned","kept");
    els.die.classList.remove("burned","kept");

    function landResult(){
      els.die.textContent=finalValue;
      els.die.classList.remove("rolling");
      els.die.classList.add("finalResult");

      // Give the table a clear moment to register the actual roll.
      const holdTime=reduced ? 700 : 1050;
      rollTimer=setTimeout(()=>{
        els.die.classList.remove("finalResult");
        rollTimer=setTimeout(()=>{
          rollTimer=null;
          done();
        }, reduced ? 120 : 260);
      },holdTime);
    }

    if(reduced){
      landResult();
      return;
    }

    let step=0;
    const steps=17;
    els.die.classList.remove("finalResult");
    els.die.classList.add("rolling");

    function tick(){
      step++;
      els.die.textContent = step===steps ? finalValue : d12();

      if(step>=steps){
        landResult();
        return;
      }

      const progress=step/(steps-1);
      const delay=34 + Math.pow(progress,2.5)*150;
      rollTimer=setTimeout(tick,delay);
    }

    tick();
  }

  function animateStokeRoll(first,second,done){
    const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const best=Math.max(first,second);
    const firstKeeps=first>=second;
    const keeper=firstKeeps ? els.die : els.die2;
    const burned=firstKeeps ? els.die2 : els.die;

    els.die.classList.remove("hiddenDie","burned","kept","finalResult");
    els.die2.classList.remove("hiddenDie","burned","kept","finalResult");

    function revealChoice(){
      els.die.textContent=first;
      els.die2.textContent=second;
      els.die.classList.remove("rolling");
      els.die2.classList.remove("rolling");
      keeper.classList.add("kept");
      burned.classList.add("burned");
      const chooseHold=reduced ? 700 : 1050;
      rollTimer=setTimeout(()=>{
        burned.classList.add("hiddenDie");
        keeper.classList.remove("kept");
        keeper.classList.add("finalResult");
        rollTimer=setTimeout(()=>{
          keeper.classList.remove("finalResult");
          // Return the surviving die to the primary slot for the next ordinary turn.
          els.die.textContent=best;
          els.die.classList.remove("hiddenDie","burned","kept");
          els.die2.classList.add("hiddenDie");
          els.die2.classList.remove("burned","kept","finalResult");
          rollTimer=setTimeout(()=>{rollTimer=null;done(best,[first,second]);},reduced?100:220);
        },reduced?650:900);
      },chooseHold);
    }

    if(reduced){ revealChoice(); return; }

    let step=0;
    const steps=19;
    els.die.classList.add("rolling");
    els.die2.classList.add("rolling");
    function tick(){
      step++;
      els.die.textContent=step===steps ? first : d12();
      els.die2.textContent=step===steps ? second : d12();
      if(step>=steps){ revealChoice(); return; }
      const progress=step/(steps-1);
      const delay=32 + Math.pow(progress,2.55)*165;
      rollTimer=setTimeout(tick,delay);
    }
    tick();
  }

  function stokeInferno(){
    if(state.gameOver||state.rolling||state.awaitingDecision||!state.players.length) return;
    const p=currentPlayer();
    if(!p||!p.alive||p.skipNext||p.stokeUsed||state.inferno>=12) return;

    p.stokeUsed=true;
    p.status="Stoking the Inferno";
    state.inferno++;
    state.rolling=true;
    p.rollsMade++;
    els.message.textContent=`${p.name} STOKES THE INFERNO — it rises to ${state.inferno}. Two dice. Keep the higher.`;
    log(`${p.name} STOKES THE INFERNO. It rises to ${state.inferno}.`);
    render();

    els.infernoCore.classList.remove("stoking");
    void els.infernoCore.offsetWidth;
    els.infernoCore.classList.add("stoking");
    rollTimer=setTimeout(()=>{
      els.infernoCore.classList.remove("stoking");
      const first=d12(), second=d12();
      animateStokeRoll(first,second,(best,pair)=>{
        state.rolling=false;
        p.lastRoll=best;
        log(`${p.name}'s Stoke rolls ${pair[0]} and ${pair[1]} — keeps ${best}.`);
        resolveRoll(p,best,false,true);
      });
    }, reducedMotionDelay());
  }

  function reducedMotionDelay(){
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 180 : 720;
  }

  function rollTurn(){
    if(state.gameOver||state.rolling||state.awaitingDecision||!state.players.length) return;
    const p=currentPlayer();
    if(!p||!p.alive) return;

    if(p.skipNext){
      p.skipNext=false;
      p.status="Skipped safely";
      els.die.textContent="12";
      els.message.textContent=`${p.name} skips this turn.`;
      log(`${p.name} skips this turn because of their previous 12.`);
      finishTurn();
      return;
    }

    state.rolling=true;
    els.message.textContent=`${p.name} is rolling...`;
    render();
    const final=d12();
    p.rollsMade++;
    animateRoll(final,()=>{
      state.rolling=false;
      resolveRoll(p,final,false);
    });
  }

  function resolveRoll(p,roll,fromReroll,fromStoke=false){
    p.lastRoll=roll;
    if(roll===1){
      eliminate(p,`${p.name} rolled a 1 and is out immediately.`);
      return;
    }
    if(roll===12){
      p.skipNext=true;
      p.status="Safe — skip next";
      els.message.textContent=`${p.name} rolled 12 — safe, and skips next turn.`;
      log(`${p.name} rolled 12 and will skip their next turn.`);
      finishTurn();
      return;
    }
    if(roll<state.inferno){
      if(!fromReroll && !fromStoke && !p.rerollUsed){
        state.awaitingDecision=true;
        p.status="In danger";
        els.message.textContent=`${p.name} rolled ${roll}, below Inferno ${state.inferno}. Buy back in for ${p.rollsMade}?`;
        log(`${p.name} rolled ${roll}, below the Inferno. Their one-time buy-back costs ${p.rollsMade}.`);
        render();
      }else{
        if(fromStoke){
          eliminate(p,`${p.name}'s Stoked roll was ${roll}, below Inferno ${state.inferno}. There is no buy-back after a Stoke.`);
        }else{
          eliminate(p,`${p.name} rolled ${roll}, below Inferno ${state.inferno}, and is out.`);
        }
      }
      return;
    }
    p.status="Safe";
    els.message.textContent=`${p.name} rolled ${roll} and is safe.`;
    log(`${p.name} rolled ${roll} and is safe.`);
    finishTurn();
  }

  function doReroll(){
    if(!state.awaitingDecision||state.rolling||state.gameOver) return;
    const p=currentPlayer();
    state.awaitingDecision=false;
    p.rerollUsed=true;
    const buyBackCost=p.rollsMade;
    state.pot += buyBackCost;
    state.rolling=true;
    els.message.textContent=`${p.name} pays ${buyBackCost} to buy back in and rerolls...`;
    log(`${p.name} pays ${buyBackCost} to buy back in. Pot: ${state.pot}.`);
    render();
    const final=d12();
    p.rollsMade++;
    animateRoll(final,()=>{
      state.rolling=false;
      resolveRoll(p,final,true);
    });
  }

  function decline(){
    if(!state.awaitingDecision||state.gameOver) return;
    state.awaitingDecision=false;
    const p=currentPlayer();
    eliminate(p,`${p.name} declines the reroll and is out.`);
  }

  function eliminate(p,text){
    p.alive=false;
    p.status="Out";
    state.roundHadElimination=true;
    state.inferno++;
    els.message.textContent=`${text} Inferno rises to ${state.inferno}.`;
    log(text);
    log(`The Inferno rises to ${state.inferno}.`);
    if(alivePlayers().length<=1){ endGame(); return; }
    finishTurn();
  }

  function finishTurn(){
    state.awaitingDecision=false;
    state.turnsLeft--;

    if(alivePlayers().length<=1){ endGame(); return; }

    const justFinished=state.current;
    if(state.turnsLeft<=0){
      if(!state.roundHadElimination){
        state.inferno++;
        log(`Nobody was eliminated in Round ${state.round}. The Inferno rises to ${state.inferno}.`);
        els.message.textContent=`No eliminations this round. Inferno rises to ${state.inferno}.`;
      }
      state.round++;
      state.turnsLeft=alivePlayers().length;
      state.roundHadElimination=false;
      log(`Round ${state.round} begins.`);
    }
    state.current=nextAliveIndex(justFinished);
    render();
  }

  function endGame(){
    state.gameOver=true;
    state.awaitingDecision=false;
    state.rolling=false;
    const winner=state.players.find(p=>p.alive);
    if(winner){
      winner.status="Winner";
      els.die.textContent="♛";
      els.message.textContent=`${winner.name} is the last one standing.`;
      els.winner.textContent=`${winner.name} wins the pot of ${state.pot}!`;
      els.winner.style.display="block";
      log(`${winner.name} wins ${state.pot}.`);
    }else{
      els.winner.textContent="No one survived.";
      els.winner.style.display="block";
    }
    render();
  }

  els.count.addEventListener("change",syncNameInputs);
  els.count.addEventListener("input",syncNameInputs);
  els.start.addEventListener("click",startGame);
  els.setupToggle.addEventListener("click",openSetup);
  els.setupClose.addEventListener("click",closeSetup);
  els.roll.addEventListener("click",rollTurn);
  els.stoke.addEventListener("click",stokeInferno);
  els.reroll.addEventListener("click",doReroll);
  els.decline.addEventListener("click",decline);
  window.addEventListener("resize",positionSeats);

  syncNameInputs();
  render();
  openSetup();
})();
</script>
</body>
</html>
